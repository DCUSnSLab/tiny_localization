/**:
    ros__parameters:
        # Topic Settings
        topics:
            gps_fix_topic: "/ublox_gps_node/fix" # GPS fix topic from ublox receiver (sensor_msgs/NavSatFix)
            imu_topic: "/zed/zed_node/imu/data" # IMU topic from VectorNav sensor (sensor_msgs/Imu)
            velocity_topic: "/hunter/velocity" # Vehicle velocity topic (std_msgs/Float64)
            output_odom_topic: "/odom" # Output odometry topic
            output_utm_topic: "/current_utm_relative_position" # Output UTM position topic

        # GPS Heading Calculation Settings
        gps_heading:
            min_distance_for_heading: 0.0 # Minimum GPS distance threshold for heading calculation (meters)
            min_speed_for_heading: 0.6 # Minimum speed threshold for reliable heading calculation (m/s)

        # EKF Process Noise Settings - Q Matrix
        # Lower values for simulation environment (sensors are more accurate)
        process_noise:
            x: 0.01 # Process noise for x position (low for accurate simulation)
            y: 0.01 # Process noise for y position (low for accurate simulation)
            yaw: 0.001 # Process noise for heading/yaw (low for accurate simulation)

        # EKF Measurement Noise Settings - R Matrix
        # Lower values for simulation environment (sensors are more accurate)
        measurement_noise:
            position:
                x: 0.05 # Measurement noise for x position (low for accurate GPS in sim)
                y: 0.05 # Measurement noise for y position (low for accurate GPS in sim)
            heading: 0.3 # Measurement noise for GPS heading (moderate)

        # Initial EKF Settings
        ekf_initial:
            position_uncertainty: 1.0 # Initial position uncertainty
            heading_uncertainty: 1.0 # Initial heading uncertainty
